<table class="download">
  <tr>
    <th>Library</th>
    <th>Description</th>
    <th>Symbols</th>
    <th>Download</th>
  </tr>
{% for lib in site.symbols %}
  <tr>
    <td><a href="{{ "/symbols/" | append: lib.title | relative_url }}">{{ lib.title }}</a></td>
    {% capture sym_lib %}{{ lib.title }}{% endcapture %}
    <td>{% include sym_description.html name=sym_lib %}</td>
    <td align="center">{{ lib.symbolcount }}</td>
    <td><a href="{{ "/download/symbols/" | append: lib.title | append: ".7z" | relative_url }}">{{ lib.archivesize }}</a></td>
  </tr>
{% endfor %}
</table>

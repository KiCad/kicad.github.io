<table class="download">
  <tr>
    <th>Library</th>
    <th>Description</th>
    <th>Models</th>
    <th>Download</th>
  </tr>
{% for lib in site.packages3d %}
  <tr>
    <td><a href="{{ "/packages3d/" | append: lib.title | relative_url }}">{{ lib.title }}</a></td>
    {% capture model_lib %}{{ lib.title }}{% endcapture %}
    <td>{% include fp_description.html name=model_lib %}</td>
    <td align="center">{{ lib.modelcount }}</td>
    <td><a href="{{ "/download/packages3d/" | append: lib.title | append: ".3dshapes.7z" | relative_url }}">{{ lib.archivesize }}</a></td>
  </tr>
{% endfor %}
</table>
